name = "lueur-push"
main = "src/index.ts"
compatibility_date = "2025-01-01"
workers_dev = true

# Toutes les 5 minutes : envoie le rappel du soir à ceux dont l'heure est venue (offre gratuite : 5 déclencheurs max).
[triggers]
crons = ["*/5 * * * *"]

# Stockage des abonnements (adresse push + heure + fuseau). Créé automatiquement au premier déploiement.
[[kv_namespaces]]
binding = "SUBS"

